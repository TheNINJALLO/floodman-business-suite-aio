name: FloodmanOperations
options:
  bundleIdPrefix: com.floodman
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: ""
targets:
  FloodmanOperations:
    type: application
    platform: iOS
    sources:
      - path: FloodmanOperations
        excludes:
          - Resources
          - Assets.xcassets
    resources:
      - path: FloodmanOperations/Resources
      - path: FloodmanOperations/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.floodman.operations
        PRODUCT_NAME: FloodmanOperations
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FloodmanOperations/Info.plist
        FLOODMAN_API_BASE_URL: https://floodman-operations.tail274417.ts.net/mobile-api/
    scheme:
      testTargets: []
