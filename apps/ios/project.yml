name: FloodmanOperations
options:
  bundleIdPrefix: com.floodman
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: ""
targets:
  FloodmanOperations:
    type: application
    platform: iOS
    sources:
      - path: FloodmanOperations
        excludes:
          - Resources
          - Assets.xcassets
    resources:
      - path: FloodmanOperations/Resources
      - path: FloodmanOperations/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.floodman.operations
        PRODUCT_NAME: FloodmanOperations
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FloodmanOperations/Info.plist
        FLOODMAN_API_BASE_URL: https://api.oninetwork.com/mobile-api/
    scheme:
      testTargets:
        - FloodmanOperationsTests
  FloodmanOperationsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FloodmanOperationsTests
    dependencies:
      - target: FloodmanOperations
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.floodman.operations.tests
        GENERATE_INFOPLIST_FILE: YES
