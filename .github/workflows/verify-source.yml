name: Verify Floodman source
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system validators
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Generate inventories
        run: python3 scripts/generate_inventory.py
      - name: Verify repository
        run: python3 scripts/verify_repo.py
