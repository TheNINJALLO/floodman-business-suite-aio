name: Build Floodman server image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'containers/**'
      - '.dockerignore'
      - 'vendor/UPSTREAMS.lock.json'
      - 'scripts/verify_container_inputs.py'
      - '.github/workflows/build-server-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify immutable build inputs
        run: python3 scripts/verify_container_inputs.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: containers/derivative/Dockerfile
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/floodman-operations:4.6.9
            ghcr.io/${{ github.repository_owner }}/floodman-operations:4.6.9-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=4.6.9
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record published digest and build-input checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf '%s\n' '${{ steps.build.outputs.digest }}' > artifacts/IMAGE-DIGEST.txt
          sha256sum \
            .dockerignore \
            containers/derivative/Dockerfile \
            server/MANIFEST.sha256 \
            vendor/UPSTREAMS.lock.json \
            > artifacts/BUILD-INPUT-SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Floodman-Operations-server-4.6.9-build-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
