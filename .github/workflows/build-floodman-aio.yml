name: Build Floodman AIO From Mobile Upload

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'floodman-source.zip'
      - '.github/workflows/build-floodman-aio.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: floodman-aio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Check the one uploaded source file
        shell: bash
        run: |
          test -f floodman-source.zip || { echo 'Upload floodman-source.zip to the repository root first.'; exit 1; }
          python - <<'PY_CHECK'
          import pathlib, zipfile
          p=pathlib.Path('floodman-source.zip')
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              required={
                  'floodman-source/VERSION',
                  'floodman-source/source.json',
                  'floodman-source/MANIFEST.sha256',
                  'floodman-source/overlay/opt/floodman/aio/start-suite.sh',
              }
              missing=sorted(required-names)
              if missing:
                  raise SystemExit(f'Missing: {missing}')
              if any(n.startswith('/') or '..' in pathlib.PurePosixPath(n).parts for n in names):
                  raise SystemExit('Unsafe archive path found')
          print('Source archive is structurally valid.')
          PY_CHECK

      - name: Create the runtime Dockerfile
        shell: bash
        run: |
          cat > Dockerfile.floodman <<'FLOODMAN_DOCKERFILE'
          ARG GAUZY_API_IMAGE=ghcr.io/ever-co/gauzy-api:latest
          ARG GAUZY_WEB_IMAGE=ghcr.io/ever-co/gauzy-webapp:latest
          ARG DOCUMENSO_IMAGE=documenso/documenso:v2.11.0
          ARG MAILPIT_IMAGE=axllent/mailpit:latest
          
          FROM ${GAUZY_WEB_IMAGE} AS gauzy_web
          FROM ${DOCUMENSO_IMAGE} AS documenso
          FROM ${MAILPIT_IMAGE} AS mailpit
          FROM ${GAUZY_API_IMAGE} AS runtime
          
          LABEL org.opencontainers.image.title="Floodman Business Suite - Pterodactyl Mobile Runtime"
          LABEL org.opencontainers.image.description="Single-container test runtime for panel-only Floodman installation."
          LABEL org.opencontainers.image.version="3.2.0-pterodactyl-mobile-test"
          LABEL org.opencontainers.image.source="https://github.com/TheNINJALLO/floodman-business-suite-aio"
          
          USER root
          RUN apk add --no-cache \
                bash ca-certificates coreutils curl gettext jq netcat-openbsd nginx openssl unzip \
                postgresql17 postgresql17-client postgresql17-contrib \
                python3 py3-pip supervisor tzdata font-freefont \
                libstdc++ libc6-compat gcompat \
              && apk add --no-cache --virtual .python-build-deps \
                build-base cargo libffi-dev linux-headers openssl-dev python3-dev \
              && if id node >/dev/null 2>&1; then \
                   sed -i 's/^node:/container:/' /etc/passwd; \
                   sed -i 's#:/home/node:#:/home/container:#' /etc/passwd; \
                   sed -i 's/^node:/container:/' /etc/group; \
                 else \
                   addgroup -g 1000 container && adduser -D -u 1000 -G container -h /home/container -s /bin/sh container; \
                 fi \
              && mkdir -p /home/container /opt/floodman /opt/pydeps /tmp/floodman-source \
              && chown -R 1000:1000 /home/container
          
          COPY --from=gauzy_web --chown=container:container /srv/gauzy/ /opt/gauzy-web-pristine/
          COPY --from=documenso --chown=container:container /app/ /opt/documenso/
          COPY --from=documenso --chown=container:container /usr/local/ /opt/documenso-runtime/usr/local/
          COPY --from=mailpit /mailpit /usr/local/bin/mailpit
          
          COPY floodman-source.zip /tmp/floodman-source.zip
          
          RUN unzip -q /tmp/floodman-source.zip -d /tmp/floodman-source \
              && cd /tmp/floodman-source/floodman-source \
              && sha256sum -c MANIFEST.sha256 \
              && test "$(cat VERSION)" = "3.2.0"
          
          RUN python3 -m pip install --no-cache-dir --break-system-packages --target /opt/pydeps/orchestrator -r /tmp/floodman-source/floodman-source/requirements/orchestrator.txt \
              && python3 -m pip install --no-cache-dir --break-system-packages --target /opt/pydeps/messaging-ai -r /tmp/floodman-source/floodman-source/requirements/messaging-ai.txt \
              && python3 -m pip install --no-cache-dir --break-system-packages --target /opt/pydeps/competitor-intel -r /tmp/floodman-source/floodman-source/requirements/competitor-intel.txt \
              && python3 -m pip install --no-cache-dir --break-system-packages --target /opt/pydeps/office-console -r /tmp/floodman-source/floodman-source/requirements/office-console.txt \
              && python3 -m pip install --no-cache-dir --break-system-packages --target /opt/pydeps/local-lab -r /tmp/floodman-source/floodman-source/requirements/local-lab.txt \
              && cp -a /tmp/floodman-source/floodman-source/overlay/opt/floodman/. /opt/floodman/ \
              && printf '%s\n' '3.2.0' > /opt/floodman/RUNTIME_VERSION \
              && rm -rf /tmp/floodman-source /tmp/floodman-source.zip \
              && apk del .python-build-deps
          
          RUN mkdir -p /opt/floodman/gauzy-public-seed \
              && if [ -d /srv/gauzy/apps/api/public ]; then cp -a /srv/gauzy/apps/api/public/. /opt/floodman/gauzy-public-seed/; fi \
              && rm -rf /srv/gauzy/apps/api/public /import \
              && ln -s /home/container/data/gauzy-files /srv/gauzy/apps/api/public \
              && ln -s /home/container/data/gauzy-import /import \
              && chmod 0755 /usr/local/bin/mailpit /opt/floodman/aio/*.sh \
              && chown -R 1000:1000 /opt/floodman /opt/pydeps /srv/gauzy /home/container
          
          ENV USER=container HOME=/home/container FM_HOME=/home/container PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1
          WORKDIR /home/container
          USER container
          EXPOSE 9000 9001 9002 9003 9004
          ENTRYPOINT ["/opt/floodman/aio/pterodactyl-entrypoint.sh"]
          CMD ["bash", "./mobile-start.sh"]
          FLOODMAN_DOCKERFILE

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          docker system prune -af || true
          df -h

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/floodman-business-suite-aio" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Floodman AIO
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.floodman
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:3.2.0
            ${{ steps.image.outputs.name }}:latest-mobile-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
