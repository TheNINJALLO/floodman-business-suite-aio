name: Build shared Voice and Suite portal update
on:
  workflow_dispatch:
  push:
    branches: [feature/roomflow-capture]
    paths:
      - 'server/office-console/app/**'
      - 'server/orchestrator/app/**'
      - 'server/pwa/**'
      - 'server/hub/**'
      - 'containers/unified-portal/**'
      - '.github/workflows/build-unified-portal.yml'
permissions:
  contents: read
  packages: write
concurrency:
  group: floodman-unified-portal
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: image
        with:
          context: .
          file: containers/unified-portal/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/theninjallo/floodman-operations:unified-portal-${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record immutable image
        run: echo '${{ steps.image.outputs.digest }}' > IMAGE-DIGEST.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unified-portal-image-digest
          path: IMAGE-DIGEST.txt
          if-no-files-found: error
