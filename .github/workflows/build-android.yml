name: Build Floodman Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'vendor/roomflow/**'
      - 'scripts/fetch-roomflow.sh'
      - '.github/workflows/build-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || test ${PIPESTATUS[1]} -eq 0
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare bundled RoomFlow
        working-directory: apps/android
        run: bash scripts/prepare-roomflow-assets.sh
      - name: Configure build
        working-directory: apps/android
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          FLOODMAN_API_BASE_URL=${{ vars.FLOODMAN_API_BASE_URL }}
          SQUARE_APPLICATION_ID=${{ vars.SQUARE_APPLICATION_ID }}
          EOF
      - name: Compile, test, lint and package
        working-directory: apps/android
        run: gradle --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Floodman-Operations-Android-0.3.0-alpha11
          path: |
            apps/android/app/build/outputs/apk/**/*.apk
            apps/android/app/build/outputs/bundle/**/*.aab
            apps/android/app/build/reports/**
