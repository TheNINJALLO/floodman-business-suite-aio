name: Build Floodman Operations AIO v3.8.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'floodman-source.zip'
      - '.github/workflows/build-floodman-aio-v3.8.0.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: floodman-aio-v3.8.0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Validate Floodman source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f floodman-source.zip || { echo 'Upload floodman-source.zip to the repository root.'; exit 1; }
          rm -rf source-check
          unzip -q floodman-source.zip -d source-check
          cd source-check/floodman-source
          test "$(cat VERSION)" = "3.8.0"
          sha256sum -c MANIFEST.sha256
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('.')
          metadata = json.loads((root / 'source.json').read_text())
          assert metadata['version'] == '3.8.0'
          assert metadata['roomflow']['same_origin'] is True
          required = [
              'overlay/opt/floodman/aio/start-suite.sh',
              'overlay/opt/floodman/aio/nginx.conf.template',
              'overlay/opt/floodman/roomflow/prepare-roomflow.py',
              'overlay/opt/floodman/roomflow/floodman-panel.js',
              'overlay/opt/floodman/roomflow/floodman-panel.css',
              'overlay/opt/floodman/office-console/app/main.py',
              'overlay/opt/floodman/office-console/app/store.py',
              'overlay/opt/floodman/hub/hub.js',
              'overlay/opt/floodman/pwa/manifest.webmanifest',
              'overlay/opt/floodman/pwa/floodman-sw.js',
          ]
          missing = [p for p in required if not (root / p).is_file()]
          if missing:
              raise SystemExit(f'Missing required paths: {missing}')
          print('Floodman source structure is valid.')
          PY

      - name: Validate integrated RoomFlow and cumulative runtime
        shell: bash
        run: |
          set -euo pipefail
          cd source-check/floodman-source
          ROOT='overlay/opt/floodman'
          python -m compileall -q "$ROOT"
          find "$ROOT" -type f -name '*.sh' -print0 | xargs -0 -n1 sh -n
          node --check "$ROOT/roomflow/floodman-panel.js"
          node --check "$ROOT/hub/hub.js"
          node --check "$ROOT/pwa/floodman-sw.js"
          python -m json.tool "$ROOT/pwa/manifest.webmanifest" >/dev/null
          grep -F 'location ^~ /roomflow/' "$ROOT/aio/nginx.conf.template"
          grep -F 'alias /home/container/data/roomflow/current/' "$ROOT/aio/nginx.conf.template"
          grep -F 'auth_request /__roomflow_auth' "$ROOT/aio/nginx.conf.template"
          grep -F '/office/api/roomflow/customers/{contact_id}' "$ROOT/office-console/app/main.py"
          grep -F '/office/api/roomflow/sync' "$ROOT/office-console/app/main.py"
          grep -F 'roomflow_jobs' "$ROOT/office-console/app/store.py"
          grep -F 'office/api/search/contacts' "$ROOT/roomflow/floodman-panel.js"
          grep -F 'Save job & sync estimate' "$ROOT/roomflow/floodman-panel.js"
          grep -F 'America/Detroit' "$ROOT/roomflow/floodman-panel.js" "$ROOT/roomflow/prepare-roomflow.py"
          grep -F '"url": "/roomflow/?source=pwa-shortcut"' "$ROOT/pwa/manifest.webmanifest"
          echo 'Integrated RoomFlow and cumulative runtime checks passed.'

      - name: Create derivative runtime Dockerfile
        shell: bash
        run: |
          cat > Dockerfile.floodman-v3.8.0 <<'DOCKERFILE'
          FROM ghcr.io/theninjallo/floodman-business-suite-aio:3.2.2

          LABEL org.opencontainers.image.title="Floodman Operations AIO"
          LABEL org.opencontainers.image.description="Floodman Operations with RoomFlow embedded in the authenticated panel, professional CRM, private PWA, signing, Square billing, messaging, receivables, imports, and competitor intelligence."
          LABEL org.opencontainers.image.version="3.8.0"
          LABEL org.opencontainers.image.authors="Josh Aldrich"
          LABEL org.opencontainers.image.source="https://github.com/TheNINJALLO/floodman-business-suite-aio"

          USER root
          COPY floodman-source.zip /tmp/floodman-source.zip
          RUN set -eux; \
              rm -rf /tmp/floodman-source; \
              mkdir -p /tmp/floodman-source; \
              unzip -q /tmp/floodman-source.zip -d /tmp/floodman-source; \
              cd /tmp/floodman-source/floodman-source; \
              test "$(cat VERSION)" = "3.8.0"; \
              sha256sum -c MANIFEST.sha256; \
              rm -rf /opt/floodman; \
              mkdir -p /opt/floodman; \
              cp -a overlay/opt/floodman/. /opt/floodman/; \
              chmod 0755 /opt/floodman/aio/*.sh; \
              chmod -R a+rX /opt/floodman; \
              printf '%s\n' '3.8.0' > /opt/floodman/RUNTIME_VERSION; \
              rm -rf /tmp/floodman-source /tmp/floodman-source.zip

          # Bake the exact inspected RoomFlow source into the permanent image.
          # The mobile overlay can still download or accept an owner-uploaded
          # archive when running on an older compatibility image.
          ARG ROOMFLOW_COMMIT=1f97817a52b916875e50cc6380c0d284072b8ce8
          RUN set -eux; \
              apk add --no-cache curl tar; \
              curl -fsSL --retry 4 --connect-timeout 20 --max-time 600 \
                "https://github.com/TheNINJALLO/roomflow/archive/${ROOMFLOW_COMMIT}.tar.gz" \
                -o /tmp/roomflow.tar.gz; \
              rm -rf /opt/floodman/roomflow-pristine; \
              python3 /opt/floodman/roomflow/prepare-roomflow.py \
                --target /opt/floodman/roomflow-pristine \
                --overlay /opt/floodman/roomflow \
                --archive /tmp/roomflow.tar.gz \
                --force; \
              test -s /opt/floodman/roomflow-pristine/index.html; \
              test -s /opt/floodman/roomflow-pristine/floodman-panel.js; \
              test -s /opt/floodman/roomflow-pristine/.floodman-roomflow.json; \
              chmod -R a+rX /opt/floodman/roomflow-pristine; \
              rm -f /tmp/roomflow.tar.gz

          ENV FLOODMAN_CREATOR_NAME="Josh Aldrich"
          ENV FLOODMAN_PRODUCT_NAME="Floodman Operations"
          ENV FLOODMAN_SOURCE_VERSION="3.8.0"
          ENV TZ="America/Detroit"
          ENV AR_TIMEZONE="America/Detroit"
          ENV ROOMFLOW_WEB_URL="/roomflow/"

          USER container
          WORKDIR /home/container
          ENTRYPOINT ["/usr/local/bin/floodman-pterodactyl-entrypoint"]
          CMD ["bash", "./mobile-start.sh"]
          DOCKERFILE

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Floodman Operations v3.8.0
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.floodman-v3.8.0
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ghcr.io/theninjallo/floodman-business-suite-aio:3.8.0
            ghcr.io/theninjallo/floodman-business-suite-aio:3.2.0
            ghcr.io/theninjallo/floodman-business-suite-aio:latest-mobile-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
