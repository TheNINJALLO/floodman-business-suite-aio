name: Build Floodman Pterodactyl AIO

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'image/**'
      - 'scripts/**'
      - 'docs/**'
      - 'egg-floodman-business-suite-aio.json'
      - 'VERSION'
      - '.github/workflows/build-aio.yml'

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: floodman-aio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install --upgrade pyyaml
      - name: Validate source bundle
        run: python scripts/validate_package.py .

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          docker system prune -af || true
          df -h

      - name: Resolve lowercase GHCR image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/floodman-business-suite-aio" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64 test image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./image
          file: ./image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:3.1.1
            ${{ steps.image.outputs.name }}:latest-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Report image digest
        run: |
          echo "Image: ${{ steps.image.outputs.name }}:3.1.1"
          echo "Digest: ${{ steps.build.outputs.digest }}"
