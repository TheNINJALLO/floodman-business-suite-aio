map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Tailscale Serve and Cloudflare Tunnel terminate HTTPS before forwarding to
# this localhost-only Nginx service. Honor their forwarded scheme so the
# runtime bundle uses the browser's secure origin rather than http://localhost.
map $http_x_forwarded_proto $fm_public_scheme {
    default $scheme;
    ~*^https https;
    ~*^http http;
}

server {
    listen 9000 default_server;
    server_name _;
    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /health/live {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","service":"floodman-gauzy-hub","release":"3.0.0"}';
    }

    location = /health/remote {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","scheme":"$fm_public_scheme","host":"$http_host","forwardedProto":"$http_x_forwarded_proto"}';
    }

    location = /floodman-starting.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /floodman-brand/ {
        alias /usr/share/nginx/html/floodman-brand/;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.ico {
        return 302 /floodman-brand/floodman-mark.svg;
    }

    location = /floodman-hub.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    location = /floodman-hub.css {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    location = /floodman-hub-config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    # Floodman Office routes are published through the Gauzy origin so the
    # staff workspace feels like one application and Office cookies/links stay
    # on the same host. Native Gauzy routes continue through the root proxy.
    location ~ ^/(office(?:/|$)|setup(?:/|$)|login(?:/|$)|logout(?:/|$)|invite(?:/|$)) {
        proxy_pass http://office-console:8700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fm_public_scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /api {
        return 308 /api/;
    }

    # Gauzy's browser configuration expects API_BASE_URL to be the origin root.
    # Gauzy appends /api to its own endpoints, so the public URL must not contain
    # a second /api segment. This proxy receives the resulting /api/* requests.
    location /api/ {
        proxy_pass http://gauzy-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fm_public_scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    # Runtime environment values are substituted into these files without
    # changing their hashed names. Prevent a browser from keeping an older
    # JavaScript bundle and rewrite the local Gauzy origin to the exact host
    # through which the remote browser reached this Hub.
    location ~* \.(?:js|css)$ {
        proxy_pass http://gauzy-webapp:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fm_public_scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        sub_filter_types application/javascript text/javascript application/x-javascript text/css;
        sub_filter_once off;
        sub_filter 'http://localhost:9000' '$fm_public_scheme://$http_host';
        sub_filter 'http://127.0.0.1:9000' '$fm_public_scheme://$http_host';
    }

    location / {
        proxy_pass http://gauzy-webapp:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fm_public_scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_intercept_errors on;
        error_page 502 503 504 = /floodman-starting.html;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        sub_filter_once off;
        sub_filter '<title>Gauzy</title>' '<title>Floodman Operations</title>';
        sub_filter '.js"' '.js?fmhub=3.0.0"';
        sub_filter '.css"' '.css?fmhub=3.0.0"';
        sub_filter '</head>' '<link rel="icon" type="image/svg+xml" href="/floodman-brand/floodman-mark.svg"><meta name="theme-color" content="#102443"><link rel="stylesheet" href="/floodman-hub.css"></head>';
        sub_filter '</body>' '<script src="/floodman-hub-config.js"></script><script src="/floodman-hub.js"></script></body>';
    }
}
