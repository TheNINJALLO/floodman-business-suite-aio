<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="author" content="Josh Aldrich">
  <meta name="theme-color" content="#102443">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Floodman">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/floodman-pwa-icons/apple-touch-icon-180.png">
  <meta http-equiv="refresh" content="4">
  <title>Floodman Operations is starting</title>
  <style>
    html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#eef5fb;color:#102443}
    body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(520px,100%);padding:38px;border-radius:24px;background:#fff;box-shadow:0 24px 70px rgba(15,35,65,.16);text-align:center}
    img{width:min(360px,90%);height:auto;margin-bottom:22px}
    h1{margin:0 0 10px;font-size:26px}p{margin:0;color:#52657c;line-height:1.55}
    .pulse{width:46px;height:46px;margin:26px auto 0;border:5px solid #dbeafe;border-top-color:#0ea5e9;border-radius:50%;animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body><main><img src="/floodman-brand/floodman-wordmark.svg" alt="Floodman Operations"><h1>The operations hub is starting</h1><p>Floodman ERP and operations services are warming up. This page refreshes automatically.</p><div class="pulse" aria-label="Loading"></div><p style="margin-top:18px;font-size:12px">Created by Josh Aldrich</p></main></body>
</html>
