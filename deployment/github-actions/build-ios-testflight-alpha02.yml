name: 2 - Upload Floodman Operations iOS 0.1.0-alpha02 to TestFlight (credentials required)

on:
  workflow_dispatch:
    inputs:
      confirm_upload:
        description: 'Type UPLOAD only after the simulator build is green and all Apple secrets are configured'
        required: true
        default: 'NOT_READY'
        type: choice
        options:
          - NOT_READY
          - UPLOAD

permissions:
  contents: read

concurrency:
  group: floodman-ios-testflight-v010-alpha02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 150
    env:
      APP_BUNDLE_ID: com.floodman.operations

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Require deliberate TestFlight confirmation
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.confirm_upload }}' = 'UPLOAD' || {
            echo 'Run the unsigned simulator workflow first. Select UPLOAD only after Apple signing and App Store Connect secrets are configured.'
            exit 1
          }

      - name: Require signing and App Store Connect secrets
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY_BASE64; do
            test -n "${!name:-}" || { echo "Missing required GitHub secret: $name"; exit 1; }
          done

      - name: Validate and extract iOS source
        shell: bash
        run: |
          set -euo pipefail
          archive='floodman-ios-source-v0.1.0-alpha02.zip'
          test -f "$archive" || { echo "Upload $archive to the repository root."; exit 1; }
          rm -rf ios-build
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile
          archive=Path('floodman-ios-source-v0.1.0-alpha02.zip')
          with zipfile.ZipFile(archive) as bundle:
              names=set(bundle.namelist())
              unsafe=[name for name in names if name.startswith('/') or '..' in PurePosixPath(name).parts]
              if unsafe: raise SystemExit(f'Unsafe ZIP paths: {unsafe[:5]}')
              bundle.extractall('ios-build')
          root=Path('ios-build/floodman-ios')
          if (root/'VERSION').read_text().strip() != '0.1.0-alpha02':
              raise SystemExit('The iOS source VERSION is not 0.1.0-alpha02')
          PY
          cd ios-build/floodman-ios
          sha256sum -c SOURCE-MANIFEST.sha256

      - name: Select Xcode 26 and install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          xcode_path="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -n1)"
          test -n "$xcode_path" || { echo 'The macos-26 runner did not contain Xcode 26.'; exit 1; }
          sudo xcode-select -s "$xcode_path/Contents/Developer"
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodebuild -version
          xcodegen --version

      - name: Prepare pinned Floodman RoomFlow engine
        working-directory: ios-build/floodman-ios
        shell: bash
        env:
          ROOMFLOW_REF: 1f97817a52b916875e50cc6380c0d284072b8ce8
        run: |
          set -euo pipefail
          bash scripts/prepare-roomflow-assets.sh
          node --check FloodmanOperations/Resources/RoomFlow/floodman-ios-bridge.js
          test -s FloodmanOperations/Resources/RoomFlow/index.html
          test -s FloodmanOperations/Resources/RoomFlow/app.js
          xcodegen generate

      - name: Install Apple distribution certificate and provisioning profile
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/floodman-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/floodman-distribution.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/floodman.mobileprovision"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/floodman-distribution.p12" -k "$keychain" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

          profile_plist="$RUNNER_TEMP/floodman-profile.plist"
          security cms -D -i "$RUNNER_TEMP/floodman.mobileprovision" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          case "$profile_app_id" in
            *.${APP_BUNDLE_ID}) ;;
            *) echo "Provisioning profile application identifier $profile_app_id does not match $APP_BUNDLE_ID"; exit 1 ;;
          esac
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/floodman.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"

      - name: Archive signed iPhone and iPad app
        working-directory: ios-build/floodman-ios
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FLOODMAN_API_BASE_URL: ${{ vars.FLOODMAN_API_BASE_URL }}
        run: |
          set -o pipefail
          api_url="${FLOODMAN_API_BASE_URL:-https://api.oninetwork.com/mobile-api/}"
          xcodebuild \
            -project FloodmanOperations.xcodeproj \
            -scheme FloodmanOperations \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/FloodmanOperations.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            FLOODMAN_API_BASE_URL="$api_url" \
            archive 2>&1 | tee ../../xcodebuild-archive.log

      - name: Export signed IPA
        working-directory: ios-build/floodman-ios
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>provisioningProfiles</key><dict>
              <key>${APP_BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath build/FloodmanOperations.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            2>&1 | tee ../../xcodebuild-export.log
          test -s build/export/FloodmanOperations.ipa

      - name: Validate and upload to App Store Connect
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 0600 "$key_path"
          ipa='ios-build/floodman-ios/build/export/FloodmanOperations.ipa'
          xcrun altool --validate-app -f "$ipa" -t ios --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          xcrun altool --upload-app -f "$ipa" -t ios --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Collect TestFlight build artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          cp ios-build/floodman-ios/build/export/FloodmanOperations.ipa artifacts/ 2>/dev/null || true
          cp xcodebuild-archive.log xcodebuild-export.log artifacts/ 2>/dev/null || true
          cp ios-build/floodman-ios/VERSION artifacts/VERSION 2>/dev/null || true
          (cd artifacts && shasum -a 256 * > SHA256SUMS.txt) 2>/dev/null || true

      - name: Upload signed IPA and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Floodman-Operations-iOS-v0.1.0-alpha02-TestFlight
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30
